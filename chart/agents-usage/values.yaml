image:
  repository: harbor.szymonrichert.pl/containers/agents-usage
  # Defaults to the chart appVersion (the short sha CI sets when it packages the chart).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Postgres is required; there is no in-chart database (agents-helmfile deploys agents-usage-db).
# Set exactly one of url and existingSecret; existingSecretKey names the key holding the DSN.
postgres:
  url: ""
  existingSecret: ""
  existingSecretKey: uri

# The claude OAuth token, read by the prober only (mounted as a file named by
# USAGE_CLAUDE_TOKEN_FILE, never passed as an env value). Set exactly one of token and
# existingSecret; existingSecretKey names the key holding the token.
claude:
  token: ""
  existingSecret: ""
  existingSecretKey: CLAUDE_CODE_OAUTH_TOKEN

# The orchestrator service port the watcher reads the session stream from. url is required;
# set exactly one of token and existingSecret. The token is mounted into the watcher only, as a
# file named by USAGE_ORCHESTRATOR_TOKEN_FILE, never passed as an env value.
orchestrator:
  url: ""
  token: ""
  existingSecret: ""
  existingSecretKey: token

# Token-gated service listener (second port of the api pod: the orchestrator's usage gate).
# Off by default. tokensSecret names a Secret whose key holds one token per line; it is
# mounted into the api pod only, as a file named by USAGE_SERVICE_TOKENS_FILE.
serviceListener:
  enabled: false
  port: 8001
  servicePort: 8001
  tokensSecret:
    name: ""
    key: tokens

# Token-gated ingest listener (third port of the api pod: the agents' statusLine samples).
# Off by default. tokensSecret names the Secret agents-helmfile creates (shared with the agent
# pods as CCW_USAGE_TOKEN); it is mounted into the api pod only, as a file named by
# USAGE_INGEST_TOKENS_FILE. The chart never renders the token.
ingestListener:
  enabled: false
  port: 8002
  servicePort: 8002
  tokensSecret:
    name: ""
    key: token

# Extra USAGE_* settings (USAGE_ALLOWED_CIDRS, USAGE_RETENTION_DAYS, ...); keys must start
# with USAGE_.
env: {}

# Pod annotations on api only (oauth2-proxy / SSO). The prober and the watcher are singletons
# (one replica, Recreate) and have no Service.
components:
  api:
    replicas: 1
    port: 8000
    podAnnotations: {}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  prober:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 1Gi}
  watcher:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}

podLabels: {}
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The api is routed under its own prefix on the shared host. Only the UI port is routed: the
# service and ingest listeners stay in the cluster. The chart adds no cert-manager annotation:
# only one Ingress of the host carries it, the others reference the same TLS secret.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Source CIDRs the ingress refuses (ingress-nginx denylist annotation when non-empty).
  denySourceRanges: []
  hosts:
    - host: chart-example.local
      paths:
        - path: /usage
          pathType: Prefix
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

nodeSelector: {}
tolerations: []
affinity: {}
