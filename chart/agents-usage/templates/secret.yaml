{{- if and .Values.postgres.url (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-usage.databaseSecretName" . }}
  labels:
    {{- include "agents-usage.labels" . | nindent 4 }}
type: Opaque
stringData:
  uri: {{ .Values.postgres.url | quote }}
---
{{- end }}
{{- if and .Values.claude.token (not .Values.claude.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-usage.claudeSecretName" . }}
  labels:
    {{- include "agents-usage.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.claude.token | quote }}
---
{{- end }}
{{- if and .Values.orchestrator.token (not .Values.orchestrator.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-usage.orchestratorSecretName" . }}
  labels:
    {{- include "agents-usage.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.orchestrator.token | quote }}
{{- end }}
