[project]
name = "agents-usage"
version = "0.1.0"
description = "Claude plan usage windows collected from the agents' statusLine, with a lazy probe fallback and session marks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agents-common @ git+https://github.com/szymonrychu/agents-common@v0.6.0",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "psycopg[binary,pool]",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
usage = "agents_usage.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "ruff",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_usage"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
